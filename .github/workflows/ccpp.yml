name: C/C++ CI

on:
  push:
  pull_request:
    types: [assigned]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.distro }}
    
    steps:
    - uses: actions/checkout@main
      with:
        submodules: true
        fetch-depth: 0
    - name: install libudev-dev
      run: |
        sudo apt-get update
        sudo apt-get install -y libudev-dev
    - name: cmake
      run: cmake -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_PYTHON_API=1 .
    - name: make
      run: make VERBOSE=1 -j`nproc`
    - name: make package
      run: make package
    - name: rename 22.04
      if: ${{ !(matrix.distro == 'ubuntu-22.04') }}
      run: for f in packages/*.deb; do mv $f ${f%.deb}_${{ matrix.distro }}.deb; done
    - name: Archive production artifacts
      uses: actions/upload-artifact@v4
      with:
        name: packages-${{ matrix.distro }}
        path: packages
    - uses: pyTooling/Actions/releaser@v6.7.0
      if: contains(github.ref, 'develop')
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        files: |
          ./packages/*
        tag: develop
    - uses: pyTooling/Actions/releaser@v6.7.0
      if: contains(github.ref, 'main')
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        files: |
          ./packages/*
        tag: main
    - name: cmake2
      run: cmake -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_PREFIX=artifacts -DINSTALL_COMPLETION=off .
    - name: make2
      run: make VERBOSE=1 -j`nproc`
    - name: test
      run: make test
    - name: make install
      run: make install
    - name: archive
      run: tar -czf artifacts_${{ matrix.distro }}.tgz artifacts/ 
    - name: Archive production artifacts2
      uses: actions/upload-artifact@v4
      with:
        name: artifacts-${{ matrix.distro }}
        path: artifacts_${{ matrix.distro }}.tgz
    - uses: pyTooling/Actions/releaser@v6.7.0
      if: contains(github.ref, 'develop')
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        files: |
          ./artifacts_${{ matrix.distro }}.tgz
        tag: develop
    - uses: pyTooling/Actions/releaser@v6.7.0
      if: contains(github.ref, 'main')
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        files: |
          ./artifacts_${{ matrix.distro }}.tgz
        tag: main
    - name: make python_pub_sub example
      run: |
        cd example/python/pub_sub
        cmake .
        make

  scan_build:
    runs-on: ubuntu-24.04
    continue-on-error: false
    steps:
    - uses: actions/checkout@main
      with:
        submodules: true
        fetch-depth: 0
    - name: dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libudev-dev clang-tools
    - name: cmake
      run: scan-build cmake -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_PYTHON_API=1 .
    - name: make
      run: scan-build --status-bugs make -j`nproc`

  build_arm:
    runs-on: ubuntu-22.04
    continue-on-error: false
    name: Build on ${{ matrix.distro }} ${{ matrix.arch }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # aarch64 is built natively in build_aarch64 below; only the 32 bit boards, for
          # which GitHub has no runner, are still emulated here
          - arch: armv6
            distro: buster
          - arch: armv7
            distro: buster
    steps:
    - uses: actions/checkout@master
      with:
        submodules: true
        fetch-depth: 0
    - uses: uraimo/run-on-arch-action@master
      name: Run commands
      id: runcmd
      with:
        arch: ${{ matrix.arch }}
        distro: ${{ matrix.distro }}
        githubToken: ${{ github.token }}
        setup: |
          mkdir -p "${PWD}/packages"
        dockerRunArgs: |
          --volume "${PWD}/packages:/packages"
        run: |
          git config --global --add safe.directory /home/runner/work/motor-realtime/motor-realtime
          cmake -DCMAKE_BUILD_TYPE=Release -DBUILD_PYTHON_API=1 .
          make -j`nproc`
          make package
        install: |
          apt-get update -q -y
          apt-get install -y cmake build-essential libudev-dev git python3-dev
          if [ ${{ matrix.distro }} = "buster" ]; then
            # cmake 3.16 has problems
            apt-get remove -y cmake-data
            apt-get install -y cmake-data=3.13.4-1 cmake=3.13.4-1
          fi
    - name: Archive production artifacts
      uses: actions/upload-artifact@v4
      with:
        name: packages-${{ matrix.distro }}-${{ matrix.arch }}
        path: packages
    - uses: pyTooling/Actions/releaser@v6.7.0
      if: contains(github.ref, 'develop')
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        files: |
          ./packages/*
        tag: develop
    - uses: pyTooling/Actions/releaser@v6.7.0
      if: contains(github.ref, 'main')
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        files: |
          ./packages/*
        tag: main
    - uses: uraimo/run-on-arch-action@master
      name: Run commands2
      id: runcmd2
      with:
        arch: ${{ matrix.arch }}
        distro: ${{ matrix.distro }}
        githubToken: ${{ github.token }}
        setup: |
          mkdir -p "${PWD}/packages"
        dockerRunArgs: |
          --volume "${PWD}/packages:/packages"
        run: |
          git config --global --add safe.directory /home/runner/work/motor-realtime/motor-realtime
          # Note switched build type from RelWithDebInfo to Debug to fix pthread_create missing issued on
          # aarch64 ubuntu18.04 build
          cmake -DCMAKE_BUILD_TYPE=Debug -DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_PREFIX=artifacts -DINSTALL_COMPLETION=off .
          make -j`nproc` VERBOSE=1
          make install
        install: |
          apt-get update -q -y
          apt-get install -y cmake build-essential libudev-dev git python3-dev
          if [ ${{ matrix.distro }} = "buster" ]; then
            # cmake 3.16 has problems
            apt-get remove -y cmake-data
            apt-get install -y cmake-data=3.13.4-1 cmake=3.13.4-1
          fi
    - name: archive2
      run: tar -czf artifacts_${{ matrix.distro }}_${{ matrix.arch }}.tgz artifacts/ 
    - name: Archive production artifacts2
      uses: actions/upload-artifact@v4
      with:
        name: artifacts-${{ matrix.distro }}-${{ matrix.arch }}
        path: artifacts_${{ matrix.distro }}_${{ matrix.arch }}.tgz
    - uses: pyTooling/Actions/releaser@v6.7.0
      if: contains(github.ref, 'develop')
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        files: |
          ./artifacts_${{ matrix.distro }}_${{ matrix.arch }}.tgz
        tag: develop
    - uses: pyTooling/Actions/releaser@v6.7.0
      if: contains(github.ref, 'main')
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        files: |
          ./artifacts_${{ matrix.distro }}_${{ matrix.arch }}.tgz
        tag: main

  build_aarch64:
    # aarch64 packages, each built in a container of its distribution on one of GitHub's
    # arm64 runners: native, where run-on-arch emulates the processor (about a minute
    # here against a quarter of an hour).
    runs-on: ubuntu-24.04-arm
    name: ${{ matrix.name }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Build on ubuntu18.04 aarch64
            distro: ubuntu18.04
            image: ubuntu:18.04
          - name: Build on ubuntu20.04 aarch64
            distro: ubuntu20.04
            image: ubuntu:20.04
            package_suffix: _ubuntu-20.04
          - name: Build on ubuntu_latest aarch64
            distro: ubuntu_latest
            image: ubuntu:24.04
            package_suffix: _ubuntu-24.04
          # For a Jetson Nano: L4T R32 is Ubuntu 18.04 on Linux 4.9, which needs
          # SYSFS_REOPEN_AFTER_EMPTY_READ. Only the package is built for it.
          - name: Build for Jetson Nano
            distro: jetson-nano
            image: ubuntu:18.04
            package_suffix: _jetson-nano
            cmake_options: -DSYSFS_REOPEN_AFTER_EMPTY_READ=ON
            package_only: true
    steps:
    - uses: actions/checkout@master
      with:
        submodules: true
        fetch-depth: 0
    - name: container with the build tools
      run: |
        docker build -t builder - <<EOF
        FROM ${{ matrix.image }}
        ENV DEBIAN_FRONTEND=noninteractive
        RUN apt-get update -q -y && apt-get install -q -y cmake build-essential libudev-dev git python3-dev
        RUN git config --global --add safe.directory "*"
        EOF
    - name: build the package
      run: |
        docker run --rm --volume "${PWD}:${PWD}" --workdir "${PWD}" builder bash -ec '
          cmake -DCMAKE_BUILD_TYPE=Release -DBUILD_PYTHON_API=1 ${{ matrix.cmake_options }} .
          make -j`nproc`
          make package'
        sudo chown -R "$(id -u):$(id -g)" .
        if [ -n "${{ matrix.package_suffix }}" ]; then
          for f in packages/*.deb; do mv $f ${f%.deb}${{ matrix.package_suffix }}.deb; done
        fi
        ls -l packages
    - name: Archive production artifacts
      uses: actions/upload-artifact@v4
      with:
        name: packages-${{ matrix.distro }}-aarch64
        path: packages
    - name: build the static programs
      if: ${{ !matrix.package_only }}
      run: |
        # Debug and not RelWithDebInfo: that fixed a missing pthread_create in the
        # aarch64 ubuntu18.04 build
        docker run --rm --volume "${PWD}:${PWD}" --workdir "${PWD}" builder bash -ec '
          cmake -DCMAKE_BUILD_TYPE=Debug -DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_PREFIX=artifacts -DINSTALL_COMPLETION=off .
          make -j`nproc` VERBOSE=1
          make install'
        sudo chown -R "$(id -u):$(id -g)" .
        tar -czf artifacts_${{ matrix.distro }}_aarch64.tgz artifacts/
    - name: Archive production artifacts2
      if: ${{ !matrix.package_only }}
      uses: actions/upload-artifact@v4
      with:
        name: artifacts-${{ matrix.distro }}-aarch64
        path: artifacts_${{ matrix.distro }}_aarch64.tgz

  release_aarch64:
    # Adds what build_aarch64 made to the release. On an x86 runner, not in the job that
    # builds: the releaser action is a container that exists for amd64 only and cannot
    # run on the arm64 runner.
    needs: build_aarch64
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: packages-*-aarch64
        path: packages
        merge-multiple: true
    - uses: actions/download-artifact@v4
      with:
        pattern: artifacts-*-aarch64
        merge-multiple: true
    - run: ls -l packages artifacts_*_aarch64.tgz
    - uses: pyTooling/Actions/releaser@v6.7.0
      if: contains(github.ref, 'develop')
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        files: |
          ./packages/*
          ./artifacts_*_aarch64.tgz
        tag: develop
    - uses: pyTooling/Actions/releaser@v6.7.0
      if: contains(github.ref, 'main')
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        files: |
          ./packages/*
          ./artifacts_*_aarch64.tgz
        tag: main

  merge_artifacts:
    runs-on: ubuntu-latest
    # after the release job: it reads the artifacts that are merged, and deleted, here
    needs: [build, build_arm, build_aarch64, release_aarch64]
    steps:
    - name: Merge packages
      uses: actions/upload-artifact/merge@v4
      with:
        delete-merged: true
        name: packages
        pattern: packages-*
    - name: Merge artifacts
      uses: actions/upload-artifact/merge@v4
      with:
        delete-merged: true
        name: artifacts
        pattern: artifacts-*


  test:
    timeout-minutes: 10
    needs: [build, merge_artifacts]
    runs-on: [self-hosted, motor_enc]

    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu-22.04]

    steps:
    - uses: actions/download-artifact@v4
      with:
        name: artifacts
    - name: test
      run: |
        ls
        tar xzf artifacts_${{ matrix.distro }}.tgz
        cd artifacts/
        ./bin/motor_util
        ./bin/motor_util --set-timeout 10
        ./bin/motor_util -l
        ./bin/motor_util -l | grep Board\ name
        ./bin/motor_util -l | grep motor
        ./bin/motor_util -u
        ./bin/motor_util -u -l
        ./bin/motor_util -u -l | grep Board\ name
        ./bin/motor_util -u -l | grep motor

        # [ $(./bin/motor_util -p 1-3.1 | wc -l) -eq 4 ]
        # [ $(./bin/motor_util -p 1-3.1 --no-list | wc -l) -eq 0 ]
        dfu-util -e -p 1-3.1 || true
        sleep 1
        ./bin/motor_util | grep "dfu device"
        /usr/share/motor-realtime/scripts/dfu_leave_all.sh
        sleep 2
        ! ./bin/motor_util | grep "dfu device"

        time ./bin/motor_util

        cd share/motor-realtime
        PYTHONPATH=. ./python/example.py
        
